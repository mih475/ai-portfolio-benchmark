name: Backtest (date range)

# Runs the roster over a date range in one job (state carries across days),
# then prints a leaderboard and uploads all results as an artifact. Nothing is
# committed back to the repo. Default roster = 3 Gemini personas + random
# control, which is free on the Gemini free tier.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backtest start date (YYYY-MM-DD, a past weekday)"
        required: true
        default: "2026-04-01"
      end_date:
        description: "Backtest end date (YYYY-MM-DD, inclusive)"
        required: true
        default: "2026-06-30"
      agents:
        description: "Comma-separated agent ids"
        required: true
        default: "gemini_conservative,gemini_balanced,gemini_aggressive,random_control"
      max_tool_calls:
        description: "Per-agent tool-call budget (lower = cheaper/faster, shallower research)"
        required: true
        default: "8"

jobs:
  backtest:
    runs-on: ubuntu-latest
    # Backstop under GitHub's hard 6h job cap. A single quarter runs well under
    # this; run separate quarters as separate dispatches rather than one long range.
    timeout-minutes: 330
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt

      - name: Run backtest
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          MAX_TOOL_CALLS: ${{ inputs.max_tool_calls }}
          JITTER_MAX: "0"   # paid tier: no inter-agent pause needed
        run: |
          python -m v2.main \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --agents "${{ inputs.agents }}"

      - name: Summarize results
        if: always()
        run: python3 v2/scripts/summarize_backtest.py

      - name: Monte-Carlo distribution + beat-SPY analysis
        if: always()
        run: python3 v2/scripts/monte_carlo.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            v2/data/portfolios/*.json
            v2/data/portfolios/summary.md
            v2/data/portfolios/monte_carlo.md
            v2/data/snapshots/*.json
          if-no-files-found: warn
