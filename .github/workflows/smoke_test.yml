name: Smoke Test (single agent)

# Cheap end-to-end validation: builds the MIH snapshot and runs ONE agent
# through the full tool-loop + simulator, then uploads the produced data as an
# artifact. It does NOT commit anything back to the repo, so it's safe to run
# repeatedly. Use it to confirm the pipeline works before a full roster run.

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent id to run (e.g. chatgpt_balanced, claude_balanced, deepseek_balanced)"
        required: true
        default: "chatgpt_balanced"
      run_date:
        description: "Simulation date (YYYY-MM-DD). Note: pricing currently uses the latest bar regardless."
        required: true
        default: "2026-04-07"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt

      - name: Run single-agent smoke test
        env:
          # Only the chosen agent's provider key is strictly required; the rest
          # are passed through if set. MIH data keys (FRED/Brave/Finnhub) are
          # optional — their absence degrades the snapshot but shouldn't crash.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m v2.main --run-date "${{ inputs.run_date }}" --agents "${{ inputs.agent }}"

      - name: Upload produced data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: |
            v2/data/snapshots/*.json
            v2/data/portfolios/*.json
          if-no-files-found: warn
