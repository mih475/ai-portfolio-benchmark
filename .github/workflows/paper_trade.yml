name: Paper Trade (live daily)

# Forward paper-trading test: run the agent under test on live, unseen market
# data once per trading day and commit the updated portfolio + ledger back to
# the repo. No real money. This is the test that removes the backtest biases —
# the agent only ever sees today.
#
# Schedule: 22:00 UTC on weekdays (~5-6pm US Eastern, after the close and once
# yfinance has settled the day's bar). US market holidays are handled by the
# runner itself (it verifies today is a real SPY trading day and no-ops if not),
# so a holiday run simply commits nothing.

on:
  workflow_dispatch:
    inputs:
      agents:
        description: "Agents to paper-trade"
        required: true
        default: "claude_aggressive,random_control"
      date:
        description: "Force a run date YYYY-MM-DD (blank = today)"
        required: false
        default: ""
  schedule:
    - cron: "0 22 * * 1-5"   # 22:00 UTC = 16:00 US Central (after the 15:00 CT close)

# Never let two daily runs overlap and race on the committed state.
concurrency:
  group: paper-trade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Separate, committed state dir so live trading never collides with
      # throwaway backtest state.
      PORTFOLIOS_DIR: ${{ github.workspace }}/v2/data/paper/portfolios
      MAX_TOOL_CALLS: "4"
      JITTER_MAX: "0"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt

      - name: Run live paper-trade day
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Live mode (unlike historical backtests) calls Brave web-search for the
          # market narrative and catalysts. Absent key degrades gracefully, but
          # pass it if set so live news works.
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          AGENTS="${{ github.event.inputs.agents }}"
          AGENTS="${AGENTS:-claude_aggressive,random_control}"
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python -m v2.live_runner --agents "$AGENTS" $DATE_ARG

      - name: Commit updated portfolio + ledger
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2/data/paper || true
          if git diff --cached --quiet; then
            echo "No paper-trade changes to commit (likely a non-market day)."
          else
            git commit -m "Paper trade: $(date -u +%Y-%m-%d) [skip ci]"
            # Rebase onto any concurrent commits before pushing.
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload ledger artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-ledger
          path: |
            v2/data/paper/portfolios/ledger.md
            v2/data/paper/portfolios/ledger.json
          if-no-files-found: warn
