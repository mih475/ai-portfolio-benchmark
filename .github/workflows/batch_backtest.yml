name: Batch Backtest (multi-quarter)

# One-click multi-quarter batch toward a statistically real "beat SPY?" answer.
# Runs each quarter as its own independent $10k job (safe under the 6h cap),
# then an aggregate job pools all quarters' daily (agent, SPY) pairs and runs the
# paired bootstrap for a combined verdict. Default roster is the cheap
# aggressive + random control at tool budget 4.
#
# The set of quarters is now an input: a `prepare` job turns a compact list like
# "2022Q1 2022Q2 2022Q3 2022Q4" into the job matrix, so any regime (e.g. the 2022
# bear market) is a one-click run without editing this file.

on:
  workflow_dispatch:
    inputs:
      agents:
        description: "Agents to run each quarter"
        required: true
        default: "gemini_aggressive,random_control"
      max_tool_calls:
        description: "Per-agent tool-call budget (lower = cheaper)"
        required: true
        default: "4"
      quarters:
        description: "Quarters to run (space/comma separated, e.g. '2022Q1 2022Q2 2022Q3 2022Q4')"
        required: true
        default: "2024Q1 2024Q2 2024Q3 2024Q4 2025Q1 2025Q2 2025Q3 2025Q4"

jobs:
  prepare:
    # Turn the free-form `quarters` input into a JSON matrix the quarter job can
    # consume via fromJSON. Each YYYYQn token becomes {name, start, end}.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        env:
          QUARTERS: ${{ inputs.quarters }}
        run: |
          python3 - <<'PY'
          import json, os, re
          raw = os.environ["QUARTERS"]
          bounds = {"1": ("01-01", "03-31"), "2": ("04-01", "06-30"),
                    "3": ("07-01", "09-30"), "4": ("10-01", "12-31")}
          out = []
          for tok in re.split(r"[,\s]+", raw.strip()):
              if not tok:
                  continue
              m = re.fullmatch(r"(\d{4})[Qq]([1-4])", tok)
              if not m:
                  raise SystemExit(f"bad quarter token {tok!r} — use e.g. 2022Q1")
              y, q = m.group(1), m.group(2)
              s, e = bounds[q]
              out.append({"name": f"{y}Q{q}", "start": f"{y}-{s}", "end": f"{y}-{e}"})
          if not out:
              raise SystemExit("no quarters parsed from input")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(out) + "\n")
          print("Matrix:")
          print(json.dumps(out, indent=2))
          PY

  quarter:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      max-parallel: 3          # cap concurrency so parallel jobs don't exhaust the API RPM
      fail-fast: false         # one bad quarter must not cancel the rest
      matrix:
        q: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt
      - name: Run quarter ${{ matrix.q.name }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          MAX_TOOL_CALLS: ${{ inputs.max_tool_calls }}
          JITTER_MAX: "0"
          BACKTEST_STRICT_PRICES: "1"
        run: |
          python -m v2.main \
            --start-date "${{ matrix.q.start }}" \
            --end-date "${{ matrix.q.end }}" \
            --agents "${{ inputs.agents }}"
      - name: Summarize quarter
        if: always()
        run: python3 v2/scripts/summarize_backtest.py
      - name: Upload quarter artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.q.name }}
          path: |
            v2/data/portfolios/*.json
            v2/data/portfolios/summary.md
          if-no-files-found: warn

  aggregate:
    needs: quarter
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all quarter artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: batch-*
          path: quarters
      - name: Pool quarters into a combined verdict
        run: |
          python3 v2/scripts/combine_backtests.py quarters/batch-*/ | tee combined_verdict.md
      - name: Upload combined verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-combined-verdict
          path: combined_verdict.md
          if-no-files-found: warn
