name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The simulator suite is stdlib-only by design, so no install step is
      # needed and the tests never touch the network or any API keys.
      - name: Run PortfolioSimulator test suite
        run: python3 v2/tests/test_portfolio_simulator.py

      - name: Run format_as_toon regression test
        run: python3 v2/tests/test_format_as_toon.py

      - name: Run price_provider date-logic test
        run: python3 v2/tests/test_price_provider.py

      - name: Run FRED point-in-time test
        run: python3 v2/tests/test_fred_asof.py

      - name: Run MCP tool-gating test
        run: python3 v2/tests/test_tool_gating.py

      - name: Run backtest range + summary test
        run: python3 v2/tests/test_backtest.py

      - name: Run random control agent test
        run: python3 v2/tests/test_random_agent.py

      - name: Run Monte-Carlo analysis test
        run: python3 v2/tests/test_monte_carlo.py

      - name: Run combine-backtests test
        run: python3 v2/tests/test_combine.py

      - name: Run API parameter-shim test
        run: python3 v2/tests/test_safe_create.py

      - name: Run Anthropic thinking-block fix test
        run: python3 v2/tests/test_anthropic_thinking.py

      - name: Verify ChatGPT-only full-exit schema
        run: python3 v2/tests/test_trade_schema.py

      - name: Run live paper-trade runner test
        run: python3 v2/tests/test_live_runner.py

      - name: Run strict-price gap classifier test
        run: python3 v2/tests/test_strict_gap.py

      - name: Verify ChatGPT-v2 strict historical trade compliance (offline)
        run: python3 v2/tests/test_historical_compliance.py
